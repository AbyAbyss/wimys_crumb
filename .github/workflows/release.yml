name: Release

# Tag-driven releases. Push a version tag to build and publish:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # XcodeGen generates a current project format; pick a matching Xcode
      # so xcodebuild can read it (the runner default can lag behind).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # No test target yet — add one and uncomment this step when ready:
      # - name: Run tests
      #   run: |
      #     xcodebuild test \
      #       -project wimys_crumb.xcodeproj \
      #       -scheme wimys_crumb \
      #       -destination 'platform=macOS' \
      #       -derivedDataPath build

      - name: Build Release (unsigned)
        run: |
          xcodebuild \
            -project wimys_crumb.xcodeproj \
            -scheme wimys_crumb \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package DMG
        run: |
          APP="build/Build/Products/Release/wimys_crumb.app"
          STAGING="dmg-staging"
          mkdir "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "wimys_crumb" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "wimys_crumb-${VERSION}.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "wimys_crumb-${VERSION}.dmg" \
            --title "wimys_crumb $VERSION" \
            --generate-notes
